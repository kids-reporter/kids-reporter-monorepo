name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup and install
        uses: ./.github/actions/setup-and-install

      - name: Type check
        run: yarn type-check

  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup and install
        uses: ./.github/actions/setup-and-install

      - name: Format check
        run: yarn format:check

  lint-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup and install
        uses: ./.github/actions/setup-and-install

      - name: Lint check
        run: yarn lint:check

  content-api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kids_reporter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kids_reporter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup and install
        uses: ./.github/actions/setup-and-install

      - name: Run DB migrations (Keystone/Prisma)
        env:
          CI: 'true'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kids_reporter_test?schema=public
        run: yarn workspace @kids-reporter/cms db-migrate

      - name: Run content-api Vitest suite
        env:
          CI: 'true'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kids_reporter_test?schema=public
        run: yarn workspace @kids-reporter/content-api test
