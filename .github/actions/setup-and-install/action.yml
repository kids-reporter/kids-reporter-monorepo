name: 'Setup and Install Dependencies'
description: 'Setup Node.js, Yarn, cache dependencies and build artifacts, then install dependencies'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Enable Corepack
      run: corepack enable
      shell: bash

    - name: Setup Yarn
      run: corepack prepare yarn@4.9.4 --activate
      shell: bash

    - name: Get yarn cache directory path
      id: yarn-cache-dir-path
      run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.yarn-cache-dir-path.outputs.dir }}
          node_modules
          **/node_modules
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          packages/**/lib
          packages/**/dist
          packages/**/__generated__
          packages/**/*.tsbuildinfo
          **/*.tsbuildinfo
        key: ${{ runner.os }}-build-${{ hashFiles('packages/*/package.json','packages/*/tsconfig.json','packages/api-types/src/**/*.ts','packages/cms/schema.graphql','packages/frontend/codegen.ts','packages/frontend/src/api/graphql/**/*.ts','packages/routing-ui/scripts/build.sh','packages/routing-ui/src/index.ts','packages/core/src/index.ts','packages/draft-editor/src/index.ts','packages/draft-renderer/src/index.ts') }}
        restore-keys: |
          ${{ runner.os }}-build-

    - name: Install dependencies
      run: yarn install --immutable
      env:
        SKIP_PATCH_PACKAGE: 'true'
      shell: bash
