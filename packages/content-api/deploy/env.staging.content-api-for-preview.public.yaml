# Public (non-secret) runtime env vars for the staging-content-api-for-preview
# Cloud Run service: an internal-only variant of content-api that returns
# draft/unpublished content. Not reachable from the public internet — see
# the `--ingress internal` note in deploy/README.md. Shares
# deploy/secrets/content-api.secrets with the public content-api service
# (same database, same JWT secret).

GCP_PROJECT_ID: "kids-reporter"
GO_API_ENV: "staging"
CURRENT_ENVIRONMENT: "staging"
REQUEST_TIMEOUT_MS: "10000"
GCS_ORIGIN: "https://staging-kids-storage.twreporter.org"
IMAGES_STORAGE_PATH: "public/images"
DATABASE_PROVIDER: "postgresql"
IS_PREVIEW_SERVER: "true"
GO_API_JWT_ISSUER: "https://staging-go-api.twreporter.org"
GO_API_JWT_AUDIENCE: "https://staging.twreporter.org"
CORS_ALLOW_ORIGINS: "https://staging-kids.twreporter.org,https://staging-frontend-ehh4zj53ca-de.a.run.app"
BASE_PATH: "/content-api"
