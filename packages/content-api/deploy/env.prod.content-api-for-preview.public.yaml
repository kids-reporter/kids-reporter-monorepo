# Public (non-secret) runtime env vars for the prod-content-api-for-preview
# Cloud Run service: an internal-only variant of content-api that returns
# draft/unpublished content. Not reachable from the public internet — see
# the `--ingress internal` note in deploy/README.md. Shares
# deploy/secrets/content-api.secrets with the public content-api service
# (same database, same JWT secret).

GCP_PROJECT_ID: "kids-reporter"
GO_API_ENV: "prod"
CURRENT_ENVIRONMENT: "prod"
REQUEST_TIMEOUT_MS: "10000"
GCS_ORIGIN: "https://kids-storage.twreporter.org"
IMAGES_STORAGE_PATH: "public/images"
DATABASE_PROVIDER: "postgresql"
IS_PREVIEW_SERVER: "true"
GO_API_JWT_ISSUER: "https://go-api.twreporter.org"
GO_API_JWT_AUDIENCE: "https://www.twreporter.org"
CORS_ALLOW_ORIGINS: "https://kids.twreporter.org,https://prod-frontend-496849015885.asia-east1.run.app"
