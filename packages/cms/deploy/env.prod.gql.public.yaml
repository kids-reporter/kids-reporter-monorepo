# Public (non-secret) runtime env vars for the prod-gql Cloud Run service
# (GraphQL-only build, Dockerfile.gql-only, no gcsfuse mount, no migrations —
# depends on prod-cms having already migrated the database).
# Passwords, connection strings, API keys, and other secrets must never be
# added here — see deploy/secrets/cms.secrets (shared with prod-cms) instead.
#
# prod-cms must finish deploying (and its DB migrations complete) before
# prod-gql is deployed — see deploy/README.md's Rollout section.

IS_UI_DISABLED: 'true'
DATABASE_PROVIDER: 'postgresql'
SESSION_MAX_AGE: '86400'
FILES_BASE_URL: '/files'
FILES_STORAGE_PATH: 'public/files'
IMAGES_BASE_URL: '/images'
IMAGES_STORAGE_PATH: 'public/images'
MEMORY_CACHE_TTL: '300000'
MEMORY_CACHE_SIZE: '300'
TWO_FACTOR_AUTH_COOKIE_NAME: 'keystonejs-2fa'
TWO_FACTOR_AUTH_SERVICE_NAME: 'KidsReporter Keystone'
TWREPORTER_ID: '013371828254368986439:_ega685nikw'
GO_API_JWT_ISSUER: 'https://go-api.twreporter.org'
GO_API_JWT_AUDIENCE: 'https://www.twreporter.org'
PREVIEW_SERVER_PATH: '/preview-server'
CORS_ALLOW_ORIGINS: 'https://kids.twreporter.org,https://next-kids.twreporter.org'
NODE_ENV: 'production'
TWO_FACTOR_AUTH_ENABLE: 'true'
GCS_ORIGIN: 'https://kids-storage.twreporter.org'
PREVIEW_SERVER_ORIGIN: 'https://prod-frontend-for-preview-ehh4zj53ca-de.a.run.app'
