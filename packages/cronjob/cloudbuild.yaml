steps:
  # RSS and scheduled-post share one image but own separate runtime config.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull \
          "asia-east1-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_IMAGE_NAME}:latest" \
          || exit 0

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        case "${_ENV}" in
          dev|staging|prod) ;;
          *)
            echo "Unsupported _ENV: ${_ENV}" >&2
            exit 1
            ;;
        esac

        cp yarn.lock packages/cronjob
        cp .yarnrc.yml packages/cronjob
        cd packages/cronjob

        IMAGE="asia-east1-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_IMAGE_NAME}:${_BRANCH_NAME}_${SHORT_SHA}"
        LATEST_IMAGE="asia-east1-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_IMAGE_NAME}:latest"

        docker build \
          --tag "$${IMAGE}" \
          --tag "$${LATEST_IMAGE}" \
          --cache-from "$${LATEST_IMAGE}" \
          .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'asia-east1-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_IMAGE_NAME}:${_BRANCH_NAME}_${SHORT_SHA}'

  - name: gcr.io/cloud-builders/gcloud
    id: Deploy Jobs and Schedulers
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        case "${_ENV}" in
          dev|staging)
            SCHEDULER_STATE=paused
            ;;
          prod)
            SCHEDULER_STATE=enabled
            ;;
          *)
            echo "Unsupported _ENV: ${_ENV}" >&2
            exit 1
            ;;
        esac

        IMAGE="asia-east1-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_IMAGE_NAME}:${_BRANCH_NAME}_${SHORT_SHA}"
        RUNTIME_SERVICE_ACCOUNT="sa-kids-cloud-run-runtime@${PROJECT_ID}.iam.gserviceaccount.com"
        SCHEDULER_SERVICE_ACCOUNT="sa-kids-cloud-scheduler-trigger@${PROJECT_ID}.iam.gserviceaccount.com"
        SCHEDULE="0 1 * * *"
        TIME_ZONE="Asia/Taipei"

        # Validate both configurations before mutating either job.
        for env_file in \
          "packages/cronjob/deploy/env.${_ENV}.rss.public.yaml" \
          "packages/cronjob/deploy/env.${_ENV}.scheduled-post.public.yaml"
        do
          if [[ ! -f "$${env_file}" ]]; then
            echo "Missing deploy configuration: $${env_file}" >&2
            exit 1
          fi
        done

        deploy_job() {
          local job_suffix="$$1"
          local task_timeout="$$2"
          local env_file="packages/cronjob/deploy/env.${_ENV}.$${job_suffix}.public.yaml"
          local job_name="${_ENV}-cronjob-$${job_suffix}"
          local scheduler_uri="https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${_REGION}/jobs/$${job_name}:run"
          local labels="env=${_ENV},system=kids-reporter,job=$${job_name},resource-type=cloud-run-job,managed-by=cloud-build"
          local secrets

          case "$${job_suffix}" in
            rss)
              secrets="CRONJOB_ACCOUNT_EMAIL=$${job_name}_cronjob-account-email:latest,CRONJOB_ACCOUNT_PASSWORD=$${job_name}_cronjob-account-password:latest,SLACK_LOG_HOOK=$${job_name}_slack-log-hook:latest"
              ;;
            scheduled-post)
              secrets="CRONJOB_ACCOUNT_EMAIL=$${job_name}_cronjob-account-email:latest,CRONJOB_ACCOUNT_PASSWORD=$${job_name}_cronjob-account-password:latest"
              ;;
            *)
              echo "Unsupported cronjob: $${job_suffix}" >&2
              exit 1
              ;;
          esac

          JOB_ARGS=(
            --project="${PROJECT_ID}"
            --region="${_REGION}"
            --image="$${IMAGE}"
            --service-account="$${RUNTIME_SERVICE_ACCOUNT}"
            --env-vars-file="$${env_file}"
            --set-secrets="$${secrets}"
            --command=yarn
            --args="$${job_suffix}"
            --network=default
            --subnet=default
            --clear-network-tags
            --vpc-egress=all-traffic
            --memory=512Mi
            --cpu=1
            --task-timeout="$${task_timeout}"
            --max-retries=0
            --tasks=1
            --parallelism=1
            --labels="$${labels}"
            --quiet
          )

          if gcloud run jobs describe "$${job_name}" \
            --project="${PROJECT_ID}" \
            --region="${_REGION}" >/dev/null 2>&1
          then
            gcloud run jobs update "$${job_name}" "$${JOB_ARGS[@]}"
          else
            gcloud run jobs create "$${job_name}" "$${JOB_ARGS[@]}"
          fi

          gcloud run jobs add-iam-policy-binding "$${job_name}" \
            --project="${PROJECT_ID}" \
            --region="${_REGION}" \
            --member="serviceAccount:$${SCHEDULER_SERVICE_ACCOUNT}" \
            --role=roles/run.invoker \
            --quiet >/dev/null

          SCHEDULER_ARGS=(
            --project="${PROJECT_ID}"
            --location="${_REGION}"
            --schedule="$${SCHEDULE}"
            --time-zone="$${TIME_ZONE}"
            --uri="$${scheduler_uri}"
            --http-method=POST
            --oauth-service-account-email="$${SCHEDULER_SERVICE_ACCOUNT}"
            --oauth-token-scope=https://www.googleapis.com/auth/cloud-platform
            --max-retry-attempts=0
            --quiet
          )

          if gcloud scheduler jobs describe "$${job_name}" \
            --project="${PROJECT_ID}" \
            --location="${_REGION}" >/dev/null 2>&1
          then
            gcloud scheduler jobs update http "$${job_name}" "$${SCHEDULER_ARGS[@]}"
          else
            gcloud scheduler jobs create http "$${job_name}" \
              "$${SCHEDULER_ARGS[@]}" \
              --description="Run Cloud Run Job $${job_name}"
          fi

          current_state="$$(gcloud scheduler jobs describe "$${job_name}" \
            --project="${PROJECT_ID}" \
            --location="${_REGION}" \
            --format='value(state)')"

          if [[ "$${SCHEDULER_STATE}" == paused && "$${current_state}" != PAUSED ]]; then
            gcloud scheduler jobs pause "$${job_name}" \
              --project="${PROJECT_ID}" \
              --location="${_REGION}" \
              --quiet
          elif [[ "$${SCHEDULER_STATE}" == enabled && "$${current_state}" == PAUSED ]]; then
            gcloud scheduler jobs resume "$${job_name}" \
              --project="${PROJECT_ID}" \
              --location="${_REGION}" \
              --quiet
          fi
        }

        deploy_job rss 1800s
        deploy_job scheduled-post 300s

  # Publish latest only after both jobs and schedulers are configured.
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'asia-east1-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_IMAGE_NAME}:latest'

timeout: 2400s

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _IMAGE_NAME: cronjob
  _BRANCH_NAME: dev
  _ENV: dev # dev, staging, or prod
  _REGION: asia-east1
  _ARTIFACT_REGISTRY_REPO: cloud-run-source-deploy
